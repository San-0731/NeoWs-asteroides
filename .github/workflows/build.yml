name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Portable
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  package:
    name: Build (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Construir ejecutable
        run: python -m PyInstaller --noconfirm --clean NeoWs-Asteroides.spec
      - name: Comprimir para Linux o macOS
        if: runner.os != 'Windows'
        run: tar -czf "NeoWs-Asteroides-${{ runner.os }}.tar.gz" -C dist NeoWs-Asteroides
      - name: Comprimir para Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/NeoWs-Asteroides" -DestinationPath "NeoWs-Asteroides-Windows.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: package-${{ runner.os }}
          path: NeoWs-Asteroides-${{ runner.os }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: package-Windows
          path: NeoWs-Asteroides-Windows.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
